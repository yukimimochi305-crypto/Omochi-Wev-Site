
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Omochi's Website</title>
  <meta name="description" content="My personal website">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #111827, #312e81);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      padding: 40px 24px;
      border: 1px solid #ffffff25;
      border-radius: 24px;
      background: #ffffff10;
      box-shadow: 0 20px 60px #00000030;
    }

    h1 {
      font-size: clamp(2rem, 8vw, 3.5rem);
      margin: 0 0 12px;
    }

    p {
      color: #d1d5db;
      line-height: 1.8;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      border-radius: 12px;
      background: #818cf8;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.2s;
    }

    .button:hover {
      transform: translateY(-3px);
    }

    footer {
      margin-top: 32px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome! 👋</h1>
    <p>こんにちは！<br>
      これは自分だけのWebサイトです。
    </p>

    <a class="button"
       href="https://github.com/"
       target="_blank"
       rel="noopener noreferrer">
      Visit GitHub
    </a>

    <footer>© 2026 Omochi</footer>
  </main>
</body>
</html>
